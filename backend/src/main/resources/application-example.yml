spring:
  datasource:
    url: jdbc:mysql://localhost:3306/disaster_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 비밀번호입력
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # 개발: update / 배포: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080

# 파일 저장 경로 (팀 공통 설정)
file:
  upload-dir: uploads/images/

# 공감 임계치 (경보 발령 기준)
sympathy:
  alert-threshold: 4

logging:
  level:
    com.kyonggi.disaster: DEBUG
    org.hibernate.SQL: DEBUG
